<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Word-building cursor and dwell checks</title>
		<link rel="stylesheet" href="/src/style.css" />
		<style>
			body { display: block; height: auto; min-height: 100vh; padding: 1.5rem; }
			#results { font: 1rem/1.5 system-ui, sans-serif; }
			#test-games { position: fixed; left: -10000px; top: 0; width: 800px; height: 600px; overflow: hidden; }
			.pass { color: green; }
			.fail { color: #b00020; }
		</style>
	</head>
	<body>
		<main>
			<h1>Word-building cursor and dwell checks</h1>
			<ol id="results" aria-live="polite"></ol>
		</main>
		<div id="test-games"></div>
		<script type="module">
			import { LanguageLiteracyGame } from "/src/app.js";
			import { WordBuildingGame } from "/src/game/word-building.js";
			import { defaultQuestionBankQuery, queryClient } from "/src/queryClient.js";

			const questionBank = {
				info: {},
				questions: [
					{
						id: "unit-1-cat",
						unit: "1",
						word: "cat",
						prompt: "Build cat.",
						answerParts: ["c", "a", "t"],
						tiles: ["c", "a", "t"],
					},
					{
						id: "unit-2-llp",
						unit: "2",
						word: "llp",
						prompt: "Build llp.",
						answerParts: ["l", "l", "p"],
						tiles: ["l", "l", "p"],
					},
				],
			};
			queryClient.setQueryData(defaultQuestionBankQuery.queryKey, questionBank);

			const results = document.querySelector("#results");
			let passed = 0;
			let failed = 0;
			const testRoots = new Set();
			const asyncErrors = [];
			for (const type of ["error", "unhandledrejection"]) {
				window.addEventListener(type, (event) => {
					asyncErrors.push(event.error?.message ?? event.reason?.message ?? event.message);
					event.preventDefault();
				});
			}

			function assert(condition, message) {
				if (!condition) throw new Error(message);
			}

			function check(name, run) {
				const item = document.createElement("li");
				results.append(item);
				const errorCount = asyncErrors.length;
				return Promise.resolve()
					.then(run)
					.then(async () => {
						await settle();
						assert(asyncErrors.length === errorCount, `no uncaught errors: ${asyncErrors.slice(errorCount).join(", ")}`);
						passed += 1;
						item.className = "pass";
						item.textContent = `PASS ${name}`;
					})
					.catch((error) => {
						failed += 1;
						item.className = "fail";
						item.textContent = `FAIL ${name}: ${error.message}`;
					})
					.finally(() => {
						for (const root of testRoots) root.remove();
						testRoots.clear();
					});
			}

			function settle() {
				return new Promise((resolve) => setTimeout(resolve, 0));
			}

			function nextFrame() {
				return new Promise(requestAnimationFrame);
			}

			async function mount(
				unit,
				answers = {},
				{ canRender = () => true, getCursorSample = () => null } = {},
			) {
				const root = document.createElement("div");
				root.className = "test-game-root";
				testRoots.add(root);
				document.querySelector("#test-games").append(root);
				const progress = [];
				const game = new WordBuildingGame(root, {
					selectedUnit: String(unit),
					canRender,
					getCursorSample,
					gameState: {
						view: "play",
						questionIndex: 0,
						startedAt: Date.now(),
						completedAt: null,
						answers,
					},
					onGameStateChange: (state) => progress.push(state),
				});
				await game.render();
				await settle();
				return {
					root,
					progress,
					slots: () => [...root.querySelectorAll(".answer-slot")],
					tiles: () => [...root.querySelectorAll(".letter-tile")],
					status: () => root.querySelector(".word-feedback"),
					clear: () => root.querySelector('[aria-label="Clear"]'),
				};
			}

			async function withAppAPI(api, run) {
				const previousApi = globalThis.SquidlyAPI;
				if (api === undefined) delete globalThis.SquidlyAPI;
				else globalThis.SquidlyAPI = api;
				const root = document.createElement("div");
				root.className = "test-game-root";
				testRoots.add(root);
				document.querySelector("#test-games").append(root);

				try {
					const app = new LanguageLiteracyGame(root);
					await app.init();
					await settle();
					await settle();
					await run({ app, root });
				} finally {
					if (previousApi === undefined) delete globalThis.SquidlyAPI;
					else globalThis.SquidlyAPI = previousApi;
				}
			}

			async function withAppCursorAPI(run) {
				const listeners = [];
				await withAppAPI({ addCursorListener: (callback) => listeners.push(callback) }, async ({ app, root }) => {
					await app.init();
					app.selectWordBuildingUnit("1");
					await settle();
					await settle();
					await run({ app, root, listeners });
				});
			}

			async function activate(element) {
				await element.accessClick("dwell");
				await settle();
			}

			function dispatchDrag(element, type, transfer) {
				const event = new DragEvent(type, { bubbles: true, cancelable: true, dataTransfer: transfer });
				element.dispatchEvent(event);
				return event;
			}

			function beginDrag(tile) {
				assert(tile.draggable, "bank letters support native dragging");
				const transfer = new DataTransfer();
				assert(!dispatchDrag(tile, "dragstart", transfer).defaultPrevented, "current connected letter can start dragging");
				return transfer;
			}

			for (const [width, gap] of [["100vw", null], ["100vw", "9px"], ["1600px", null], ["1600px", "9px"]]) {
				await check(`unit-menu shares the host inset and preserves Exit height (${width}, ${gap ?? "standalone"})`, async () => {
					const root = document.createElement("div");
					root.style.cssText = `position: relative; width: ${width};`;
					if (gap) root.style.setProperty("--gap", gap);
					testRoots.add(root);
					document.querySelector("#test-games").append(root);
					const app = new LanguageLiteracyGame(root);
					const menu = app.createUnitMenu(questionBank, []);
					root.append(menu);

					const expectedPadding = Number.parseFloat(gap ?? "5px");
					const menuStyle = getComputedStyle(menu);
					assert(Math.abs(Number.parseFloat(menuStyle.paddingLeft) - expectedPadding) < 1, "left inset matches the host");
					assert(Math.abs(Number.parseFloat(menuStyle.paddingRight) - expectedPadding) < 1, "right inset matches the host");
					const menuRect = menu.getBoundingClientRect();
					const layoutRect = root.querySelector(".unit-menu-layout").getBoundingClientRect();
					assert(Math.abs(layoutRect.width - (root.clientWidth - 2 * expectedPadding)) < 1, "menu spans the same frame width as Exit's grid");
					assert(Math.abs(layoutRect.left + layoutRect.right - menuRect.left - menuRect.right) < 1, "menu stays centered inside the host inset");

					// Match AppsFrame's independent 4-by-5 overlay, not the app's grid.
					const overlay = document.createElement("div");
					overlay.style.cssText = `position: absolute; inset: ${gap ?? "5px"}; display: grid; grid-template: repeat(4, 1fr) / repeat(5, 1fr); gap: ${gap ?? "5px"};`;
					const exit = document.createElement("div");
					overlay.append(exit);
					root.append(overlay);
					const header = root.querySelector(".unit-menu-header");
					const headerRect = header.getBoundingClientRect();
					const exitRect = exit.getBoundingClientRect();
					assert(Math.abs(headerRect.top - exitRect.top) < 1, "heading and Exit have the same top edge");
					assert(Math.abs(headerRect.height - exitRect.height) < 1, "heading and Exit have the same height");
					assert(headerRect.left >= exitRect.right, "heading leaves Exit's cell clear");
					assert(header.children.length === 3, "all three heading lines remain");
					const firstLine = header.firstElementChild.getBoundingClientRect();
					const lastLine = header.lastElementChild.getBoundingClientRect();
					assert(Math.abs(firstLine.top - headerRect.top) < 1, "heading starts at the top of its grid row");
					assert(Math.abs(lastLine.bottom - headerRect.bottom) < 1, "heading fills the full height of its grid row");
					for (const line of header.children) {
						const rect = line.getBoundingClientRect();
						assert(rect.top >= headerRect.top - 1 && rect.bottom <= headerRect.bottom + 1, "heading text stays inside the first grid row");
					}
				});
			}

			await check("prompt has no left accent and helper instructions are absent", async () => {
				const game = await mount(1);
				const title = game.root.querySelector(".game-title-block");
				assert(Number.parseFloat(getComputedStyle(title).borderLeftWidth) === 0, "title has no yellow left border");
				assert(game.root.querySelector("#word-builder-prompt").textContent === "Build cat.", "question prompt remains visible");
				for (const pickingUp of [false, true]) {
					if (pickingUp) await activate(game.tiles()[0]);
					assert(game.status() === null, "helper instructions are not created, even while carrying");
				}
				await activate(game.slots()[0]);
				assert(game.status() === null, "partial placement creates no helper message");
				await activate(game.clear());
				assert(game.status() === null, "Clear creates no helper message");
			});

			await check("pickup is transient and the preview follows cursor coordinates", async () => {
				const cursor = { user: "host-mouse", source: "local", x: 31, y: 52 };
				const game = await mount(1, {}, { getCursorSample: () => cursor });
				const [first, second] = game.tiles();
				assert(first.getAttribute("aria-pressed") === "false", "available letter exposes its unselected state");
				await activate(first);
				await nextFrame();
				const preview = document.querySelector(".carried-letter-preview");
				assert(first.hasAttribute("selected"), "picked-up source is selected");
				assert(first.getAttribute("aria-pressed") === "true", "selection remains accessible without helper text");
				assert(preview?.getAttribute("aria-hidden") === "true", "preview is non-accessible decoration");
				assert(preview.style.pointerEvents === "none", "preview cannot block slot targeting");
				assert(!preview.hasAttribute("access-group"), "preview stays outside access-button groups");
				assert(document.elementFromPoint(32, 52) !== preview, "preview does not intercept pointer targets");
				assert(preview.style.transform.includes("31px") && preview.style.transform.includes("52px"), "preview uses viewport cursor coordinates");
				assert(game.slots().every((slot) => !slot.classList.contains("filled")), "pickup does not fill a slot");
				assert(game.progress.length === 0, "pickup does not save progress");
				await activate(first);
				assert(document.querySelectorAll(".carried-letter-preview").length === 1, "re-activating the carried letter does not cancel it");
				cursor.x = 80;
				cursor.y = 94;
				await nextFrame();
				assert(preview.style.transform.includes("80px") && preview.style.transform.includes("94px"), "preview updates while carrying");
				await activate(second);
				assert(!first.hasAttribute("selected") && second.hasAttribute("selected"), "a newly picked letter replaces the previous one");
				game.root.remove();
			});

			await check("dwell places into the exact empty slot and stale slots cannot place twice", async () => {
				const game = await mount(1);
				const tile = game.tiles()[2];
				await activate(tile);
				const oldEmptySlot = game.slots()[2];
				await oldEmptySlot.accessClick("dwell");
				await oldEmptySlot.accessClick("dwell");
				await settle();
				const answer = game.progress.at(-1)?.answers["unit-1-cat"];
				assert(JSON.stringify(answer?.selectedTileIds) === JSON.stringify([null, null, "unit-1-cat-tile-2"]), "letter is saved at its target slot");
				assert(answer.attempts === 0 && answer.correctAttempts === 0, "partial placement does not count an attempt");
				assert(!document.querySelector(".carried-letter-preview"), "successful placement clears the preview");
				assert(game.progress.length === 1, "placement saves progress once");
				await activate(oldEmptySlot);
				assert(game.progress.length === 1, "a detached old slot cannot mutate progress");
				game.root.remove();
			});

			await check("empty slots without a carried letter and occupied slots during a carry do nothing", async () => {
				const game = await mount(1, {
					"unit-1-cat": { selectedTileIds: [null, "unit-1-cat-tile-1", null], attempts: 0, correctAttempts: 0 },
				});
				await activate(game.slots()[0]);
				assert(game.progress.length === 0, "an empty-slot dwell without a pickup does not save");
				await activate(game.tiles()[0]);
				await activate(game.slots()[1]);
				assert(game.progress.length === 0, "carrying a letter cannot remove an occupied slot");
				assert(game.root.querySelector(".carried-letter-preview"), "an occupied drop keeps the letter carried");
				await activate(game.slots()[2]);
				assert(JSON.stringify(game.progress.at(-1)?.answers["unit-1-cat"].selectedTileIds) === JSON.stringify([null, "unit-1-cat-tile-1", "unit-1-cat-tile-0"]), "the carried letter can be placed in the remaining empty slot");
			});

			await check("out-of-order placements complete the word exactly once", async () => {
				const game = await mount(1);
				for (const [value, slotIndex] of [["t", 2], ["c", 0], ["a", 1]]) {
					const tile = game.tiles().find((candidate) =>
						candidate.getAttribute("aria-label").startsWith(`Pick up ${value},`),
					);
					const slot = game.slots()[slotIndex];
					assert(tile, `the unplaced ${value} letter remains available`);
					await activate(tile);
					await activate(slot);
				}
				const answer = game.progress.at(-1)?.answers["unit-1-cat"];
				assert(JSON.stringify(answer?.selectedTileIds) === JSON.stringify(["unit-1-cat-tile-0", "unit-1-cat-tile-1", "unit-1-cat-tile-2"]), "saved slot order spells cat");
				assert(answer.completed && answer.attempts === 1 && answer.correctAttempts === 1, "the completed correct answer increments one attempt");
				assert(game.status().getBoundingClientRect().height > 1, "correct-answer feedback remains visible");
				assert(!game.clear().hasAttribute("i-disabled"), "Clear remains enabled for placed letters");
				assert(!game.root.querySelector('[aria-label="Result"]').hasAttribute("i-disabled"), "correct completion enables progression");
				assert(!game.root.querySelector('[aria-label="Speak"]').hasAttribute("i-disabled"), "correct completion enables speech");
				game.root.remove();
			});

			await check("incorrect-answer feedback remains visible and accessible", async () => {
				const game = await mount(1);
				for (const [value, slotIndex] of [["t", 0], ["a", 1], ["c", 2]]) {
					const tile = game.tiles().find((candidate) => candidate.getAttribute("aria-label").startsWith(`Pick up ${value},`));
					await activate(tile);
					await activate(game.slots()[slotIndex]);
				}
				assert(game.status()?.classList.contains("error"), "incorrect answer keeps error feedback");
				assert(game.status().getBoundingClientRect().height > 1, "incorrect-answer feedback remains visible");
				assert(game.status().getAttribute("aria-live") === "polite", "answer feedback remains announced");
			});

			await check("legacy answers restore from the left and removal preserves later slots", async () => {
				const legacy = await mount(1, {
					"unit-1-cat": { selectedTileIds: ["unit-1-cat-tile-0"], attempts: 2, correctAttempts: 1 },
				});
				assert(legacy.slots()[0].classList.contains("filled"), "legacy first letter stays in slot one");
				assert(!legacy.slots()[1].classList.contains("filled"), "legacy short answers do not shift into later slots");
				assert(legacy.status() === null, "restored partial answers create no helper message");
				legacy.root.remove();

				const gapped = await mount(1, {
					"unit-1-cat": { selectedTileIds: [null, "unit-1-cat-tile-1", "unit-1-cat-tile-2"], attempts: 0, correctAttempts: 0 },
				});
				await activate(gapped.slots()[1]);
				assert(JSON.stringify(gapped.progress.at(-1)?.answers["unit-1-cat"].selectedTileIds) === JSON.stringify([null, null, "unit-1-cat-tile-2"]), "removing a placed letter leaves later letters in their original slots");
				await activate(gapped.tiles()[0]);
				await activate(gapped.slots()[0]);
				await activate(gapped.slots()[0]);
				assert(gapped.status() === null, "removing a letter creates no helper message");
				gapped.root.remove();
			});

			await check("repeated letters keep distinct tile identities and keyboard can place", async () => {
				const game = await mount(2);
				const tiles = game.tiles();
				await activate(tiles[1]);
				const slot = game.slots()[1];
				assert(slot.getAttribute("role") === "button" && slot.tabIndex === 0, "empty slot is an accessible keyboard target");
				assert(slot.getAttribute("aria-label") === "Empty letter slot 2", "empty slot has an indexed accessible name");
				slot.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
				await settle();
				assert(JSON.stringify(game.progress.at(-1)?.answers["unit-2-llp"]?.selectedTileIds) === JSON.stringify([null, "unit-2-llp-tile-1", null]), "keyboard placement preserves the selected duplicate letter ID");
				assert(game.status() === null, "keyboard placement creates no helper message");
				game.root.remove();
			});

			await check("Escape cancels without saving and bad coordinates do not move the preview", async () => {
				const cursor = {
					user: "host-eyes",
					source: "local",
					x: Number.NaN,
					y: Number.POSITIVE_INFINITY,
				};
				const game = await mount(1, {}, { getCursorSample: () => cursor });
				await activate(game.tiles()[0]);
				await nextFrame();
				const preview = document.querySelector(".carried-letter-preview");
				assert(preview?.hidden, "invalid coordinates hide the preview");
				document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
				assert(!document.querySelector(".carried-letter-preview"), "Escape removes the preview");
				assert(!game.tiles()[0].hasAttribute("selected"), "Escape releases the carried letter");
				assert(game.tiles()[0].getAttribute("aria-pressed") === "false", "Escape resets the accessible selection state");
				assert(game.progress.length === 0, "canceling pickup does not save progress");
				await activate(game.tiles()[0]);
				await nextFrame();
				game.slots()[0].dispatchEvent(new KeyboardEvent("keydown", { key: " ", bubbles: true }));
				await settle();
				assert(game.progress.at(-1)?.answers["unit-1-cat"]?.selectedTileIds[0] === "unit-1-cat-tile-0", "keyboard placement still works without valid cursor coordinates");
			});

			await check("Clear and source disconnection clean up the carried preview", async () => {
				const game = await mount(1);
				await activate(game.tiles()[0]);
				assert(!game.clear().hasAttribute("i-disabled"), "Clear remains available while carrying");
				await activate(game.clear());
				assert(!game.root.querySelector(".carried-letter-preview"), "Clear removes this game's preview");
				assert(game.progress.at(-1)?.answers["unit-1-cat"] === undefined, "clear does not persist an unplaced pickup");
				await activate(game.tiles()[1]);
				game.tiles()[1].remove();
				assert(!document.querySelector(".carried-letter-preview"), "disconnecting a selected source cancels its carry");

				const cleared = await mount(1, {
					"unit-1-cat": {
						selectedTileIds: ["unit-1-cat-tile-0", "unit-1-cat-tile-1", "unit-1-cat-tile-2"],
						attempts: 2,
						correctAttempts: 1,
					},
				});
				await activate(cleared.clear());
				const answer = cleared.progress.at(-1)?.answers["unit-1-cat"];
				assert(JSON.stringify(answer?.selectedTileIds) === JSON.stringify([null, null, null]), "Clear empties every slot");
				assert(answer.attempts === 2 && answer.correctAttempts === 1, "Clear preserves attempt totals");
				game.root.remove();
			});

			await check("mouse click remains a pickup and placement alternative", async () => {
				const game = await mount(1);
				game.tiles()[0].click();
				await settle();
				assert(game.tiles()[0].hasAttribute("selected"), "click picks up a bank letter");
				game.slots()[0].click();
				await settle();
				assert(game.progress.at(-1)?.answers["unit-1-cat"]?.selectedTileIds[0] === "unit-1-cat-tile-0", "click places the carried letter");
			});

			await check("view replacement cancels carry and rejects stale slots", async () => {
				let canRender = true;
				const game = await mount(1, {}, { canRender: () => canRender });
				const tile = game.tiles()[0];
				const slot = game.slots()[0];
				await activate(tile);
				canRender = false;
				await nextFrame();
				assert(!game.root.querySelector(".carried-letter-preview"), "stale game stops its carry frame");
				assert(!tile.hasAttribute("selected"), "stale game releases the source tile");
				await activate(slot);
				assert(game.progress.length === 0, "a replaced game cannot save a stale slot activation");
			});

			await check("app subscribes to Squidly cursor API once and renders without Firebase", async () => {
				await withAppCursorAPI(async ({ root, listeners }) => {
					assert(listeners.length === 1, "repeated initialization registers one permanent cursor listener");
					assert(root.querySelector(".letter-tile"), "the app renders word-building without Firebase methods");
				});
			});

			await check("local Squidly mouse and gaze samples move preview; remote samples are ignored", async () => {
				await withAppCursorAPI(async ({ root, listeners }) => {
					const tile = root.querySelector(".letter-tile");
					assert(tile, "the real app renders a word-building letter");
					await activate(tile);
					const preview = root.querySelector(".carried-letter-preview");
					assert(typeof listeners[0] === "function", "the Squidly listener is registered");
					listeners[0]({ user: "host-mouse", source: "local", x: 31, y: 52 });
					await nextFrame();
					assert(preview.style.transform.includes("31px") && preview.style.transform.includes("52px"), "local mouse samples move the carried preview");
					const sourceRect = tile.getBoundingClientRect();
					const previewRect = preview.getBoundingClientRect();
					const sourceFont = Number.parseFloat(getComputedStyle(tile.querySelector(".display-value")).fontSize);
					const previewFont = Number.parseFloat(getComputedStyle(preview).fontSize);
					assert(Math.abs(previewRect.width - sourceRect.width) < 1 && Math.abs(previewRect.height - sourceRect.height) < 1, "preview matches source tile dimensions");
					assert(Math.abs(previewFont - sourceFont) < 1, "preview matches source letter size");
					assert(Math.abs(previewRect.left + previewRect.width / 2 - 31) < 1 && Math.abs(previewRect.top + previewRect.height / 2 - 52) < 1, "preview is centered on the mouse cursor, not anchored by its top-left corner");

					listeners[0]({ user: "host-eyes", source: "local", x: 80, y: 94 });
					await nextFrame();
					assert(preview.style.transform.includes("80px") && preview.style.transform.includes("94px"), "local gaze samples move the same preview");
					const gazeRect = preview.getBoundingClientRect();
					assert(Math.abs(gazeRect.left + gazeRect.width / 2 - 80) < 1 && Math.abs(gazeRect.top + gazeRect.height / 2 - 94) < 1, "preview stays centered after gaze cursor movement");
					listeners[0]({ user: "participant-eyes", source: "remote", x: 300, y: 400 });
					await nextFrame();
					assert(preview.style.transform.includes("80px") && preview.style.transform.includes("94px"), "remote samples cannot move the local preview");
					listeners[0]({ user: "host-eyes", source: "local", x: Number.NaN, y: Number.POSITIVE_INFINITY });
					await nextFrame();
					assert(preview.hidden, "invalid local coordinates hide the preview");
					assert(window.XPos === undefined && window.YPos === undefined, "cursor movement does not depend on host globals");
				});
			});

			for (const api of [undefined, null, {}]) {
				await check(`standalone navigation and placement work with ${api === null ? "null" : typeof api} API`, async () => {
					await withAppAPI(api, async ({ app, root }) => {
						assert(root.querySelector(".unit-card"), "local menu renders");
						app.selectWordBuildingUnit("1");
						await settle();
						await settle();
						await activate(root.querySelector(".letter-tile"));
						await activate(root.querySelector(".answer-slot"));
						assert(app.wordBuildingProgress?.answers["unit-1-cat"]?.selectedTileIds[0] === "unit-1-cat-tile-0", "progress is kept locally");
						app.goToUnitMenu();
						await settle();
						assert(root.querySelector(".unit-card"), "navigation back to menu works");
					});
				});
			}

			await check("read-only Firebase API can normalize screen without firebaseSet", async () => {
				await withAppAPI({
					firebaseOnValue(key, callback) {
						if (key === "state") callback(null);
					},
				}, async ({ root }) => {
					assert(root.querySelector(".unit-card"), "missing write support does not block startup");
				});
			});

			for (const failure of ["throw", "reject", "pending"]) {
				await check(`${failure} Squidly methods cannot block local gameplay`, async () => {
					const unavailable = () => {
						if (failure === "pending") return new Promise(() => {});
						if (failure === "reject") return Promise.reject(new Error("SDK unavailable"));
						throw new Error("SDK unavailable");
					};
					await withAppAPI({
						addCursorListener: unavailable,
						firebaseOnValue: unavailable,
						firebaseSet: unavailable,
						loadUtterances: unavailable,
					}, async ({ app, root }) => {
						assert(root.querySelector(".unit-card"), "local menu renders independently");
						app.selectWordBuildingUnit("1");
						await settle();
						await settle();
						assert(root.querySelector(".letter-tile"), "preloading failure does not prevent rendering");
						await activate(root.querySelector(".letter-tile"));
						await activate(root.querySelector(".answer-slot"));
						assert(app.wordBuildingProgress?.answers["unit-1-cat"]?.selectedTileIds[0] === "unit-1-cat-tile-0", "failed writes do not prevent placement");
						const tile = root.querySelector(".letter-tile");
						const transfer = beginDrag(tile);
						dispatchDrag(root.querySelectorAll(".answer-slot")[2], "drop", transfer);
						dispatchDrag(tile, "dragend", transfer);
						await settle();
						assert(app.wordBuildingProgress?.answers["unit-1-cat"]?.selectedTileIds[2] === "unit-1-cat-tile-1", "native placement also survives failed SDK calls");
						app.goToUnitMenu();
						await settle();
						assert(root.querySelector(".unit-card"), "failed writes do not prevent navigation");
					});
				});
			}

			await check("working Firebase integration still receives and publishes progress", async () => {
				const subscriptions = new Map();
				const writes = [];
				await withAppAPI({
					firebaseOnValue: (key, callback) => subscriptions.set(key, callback),
					firebaseSet: (key, value) => writes.push([key, value]),
				}, async ({ app, root }) => {
					app.selectWordBuildingUnit("1");
					await settle();
					await settle();
					await activate(root.querySelector(".letter-tile"));
					await activate(root.querySelector(".answer-slot"));
					const saved = writes.filter(([key]) => key === "wordBuildingState").at(-1)?.[1];
					assert(JSON.parse(saved)?.answers["unit-1-cat"]?.selectedTileIds[0] === "unit-1-cat-tile-0", "placement publishes the existing JSON format");
					subscriptions.get("wordBuildingState")(JSON.stringify({
						...app.wordBuildingProgress,
						answers: { "unit-1-cat": { selectedTileIds: [null, "unit-1-cat-tile-1", null] } },
					}));
					await settle();
					await settle();
					assert(root.querySelectorAll(".answer-slot")[1].textContent === "a", "remote progress still renders");
					subscriptions.get("state")("menu");
					await settle();
					assert(root.querySelector(".unit-card"), "remote screen updates still render");
				});
			});

			for (const speech of ["missing", "throw", "reject", "working", "unsupported", "browser-failure"]) {
				await check(`${speech} Squidly speech uses the appropriate speech provider`, async () => {
					const descriptors = ["speechSynthesis", "SpeechSynthesisUtterance"].map((key) => [key, Object.getOwnPropertyDescriptor(globalThis, key)]);
					const spoken = [];
					const sdkSpoken = [];
					Object.defineProperty(globalThis, "speechSynthesis", { configurable: true, value: speech === "unsupported" ? undefined : {
						cancel() {},
						speak(utterance) {
							if (speech === "browser-failure") throw new Error("Browser speech unavailable");
							spoken.push(utterance.text);
						},
					} });
					Object.defineProperty(globalThis, "SpeechSynthesisUtterance", { configurable: true, value: class { constructor(text) { this.text = text; } } });
					try {
						await withAppAPI(["missing", "unsupported", "browser-failure"].includes(speech) ? undefined : {
							loadUtterances() { throw new Error("Preload unavailable"); },
							speak(text) {
								if (speech === "throw") throw new Error("Speech unavailable");
								if (speech === "reject") return Promise.reject(new Error("Speech unavailable"));
								sdkSpoken.push(text);
							},
						}, async () => {
							const game = await mount(1, { "unit-1-cat": { selectedTileIds: ["unit-1-cat-tile-0", "unit-1-cat-tile-1", "unit-1-cat-tile-2"] } });
							await activate(game.root.querySelector('[aria-label="Speak"]'));
							assert(JSON.stringify(spoken) === JSON.stringify(["missing", "throw", "reject"].includes(speech) ? ["cat"] : []), "browser speech is used only when SDK speech is unavailable and browser speech works");
							assert(game.root.querySelector(".word-board"), "unavailable speech does not disrupt the game");
							assert(JSON.stringify(sdkSpoken) === JSON.stringify(speech === "working" ? ["cat"] : []), "working SDK speech remains in use even if preloading fails");
						});
					} finally {
						for (const [key, descriptor] of descriptors) {
							if (descriptor) Object.defineProperty(globalThis, key, descriptor);
							else delete globalThis[key];
						}
					}
				});
			}

			await check("native drop places in the exact slot without SquidlyAPI", async () => {
				await withAppAPI(undefined, async ({ app, root }) => {
					app.selectWordBuildingUnit("1");
					await settle();
					await settle();
					const tile = root.querySelector(".letter-tile");
					const slot = root.querySelectorAll(".answer-slot")[2];
					const transfer = beginDrag(tile);
					assert(dispatchDrag(slot, "dragover", transfer).defaultPrevented, "empty slot accepts native dragging");
					dispatchDrag(slot, "drop", transfer);
					dispatchDrag(slot, "drop", transfer);
					await slot.accessClick("dwell");
					dispatchDrag(tile, "dragend", transfer);
					await settle();
					const answer = app.wordBuildingProgress?.answers["unit-1-cat"];
					assert(JSON.stringify(answer?.selectedTileIds) === JSON.stringify([null, null, "unit-1-cat-tile-0"]), "native drop saves the target slot once");
					assert(answer.attempts === 0, "partial drops do not count attempts");
					assert(!root.querySelector(".carried-letter-preview"), "successful drop clears the carry");
					assert(globalThis.SquidlyAPI === undefined, "native dragging never creates or requires an SDK");
				});
			});

			await check("native drops reject external, occupied and forged payloads", async () => {
				const game = await mount(1, { "unit-1-cat": { selectedTileIds: ["unit-1-cat-tile-0", null, null] } });
				const tile = game.tiles()[0];
				assert(dispatchDrag(tile, "dragstart", null).defaultPrevented, "a drag without a data transfer cannot start");
				const external = new DataTransfer();
				external.setData("text/plain", "unit-1-cat-tile-1");
				assert(!dispatchDrag(game.slots()[1], "dragover", external).defaultPrevented, "external drag is not accepted");
				dispatchDrag(game.slots()[1], "drop", external);
				await activate(tile);
				dispatchDrag(game.slots()[1], "drop", external);
				assert(game.progress.length === 0, "external drop cannot place even a click-carried letter");
				const transfer = beginDrag(tile);
				assert(!dispatchDrag(game.slots()[0], "dragover", transfer).defaultPrevented, "occupied slot is not accepted");
				dispatchDrag(game.slots()[0], "drop", transfer);
				for (const payload of ["missing", "unit-1-cat-tile-2"]) {
					transfer.setData("text/plain", payload);
					dispatchDrag(game.slots()[1], "drop", transfer);
				}
				assert(game.progress.length === 0, "invalid drops do not mutate progress");
				dispatchDrag(tile, "dragend", transfer);
				assert(!tile.hasAttribute("selected") && !game.root.querySelector(".carried-letter-preview"), "rejected drag cleans up on dragend");
			});

			await check("native carry hides only its preview and leaves legacy interaction usable", async () => {
				const game = await mount(1, {}, { getCursorSample: () => ({ source: "local", x: 31, y: 52 }) });
				const tile = game.tiles()[0];
				await activate(tile);
				assert(!game.root.querySelector(".carried-letter-preview").hidden, "legacy Squidly preview is initially visible");
				const transfer = beginDrag(tile);
				await nextFrame();
				assert(game.root.querySelector(".carried-letter-preview").hidden, "native dragging uses only the browser's drag image");
				await activate(game.tiles()[1]);
				await activate(game.slots()[0]);
				assert(game.progress.length === 0 && tile.hasAttribute("selected"), "dwell cannot replace or place an active native carry");
				dispatchDrag(tile, "dragend", transfer);
				await activate(game.tiles()[1]);
				assert(!game.root.querySelector(".carried-letter-preview").hidden, "legacy preview resumes for the next pickup");
				game.slots()[1].dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
				await settle();
				assert(game.progress.at(-1)?.answers["unit-1-cat"]?.selectedTileIds[1] === "unit-1-cat-tile-1", "keyboard placement still works after a native drag");
			});

			for (const cancel of ["outside", "escape", "clear", "disconnect", "stale"]) {
				await check(`native ${cancel} cancellation cleans up without saving`, async () => {
					let current = true;
					const game = await mount(1, {}, { canRender: () => current });
					const tile = game.tiles()[0];
					const slot = game.slots()[0];
					const transfer = beginDrag(tile);
					if (cancel === "outside") dispatchDrag(tile, "dragend", transfer);
					if (cancel === "escape") document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
					if (cancel === "clear") await activate(game.clear());
					if (cancel === "disconnect") tile.remove();
					if (cancel === "stale") { current = false; await nextFrame(); }
					const saved = game.progress.length;
					dispatchDrag(slot, "drop", transfer);
					await settle();
					assert(!game.root.querySelector(".carried-letter-preview") && !tile.hasAttribute("selected"), "cancellation releases preview and selection");
					assert(game.progress.length === saved && (cancel === "clear" || saved === 0), "canceled drop cannot save progress");
					if (cancel === "disconnect" || cancel === "stale") assert(dispatchDrag(tile, "dragstart", transfer).defaultPrevented, "invalid source cannot start another drag");
				});
			}

			await check("native completion preserves duplicate identities and counts one attempt", async () => {
				const game = await mount(2);
				for (const [tileIndex, slotIndex] of [[1, 1], [0, 0], [0, 2]]) {
					const tile = game.tiles()[tileIndex];
					const slot = game.slots()[slotIndex];
					const transfer = beginDrag(tile);
					dispatchDrag(slot, "drop", transfer);
					dispatchDrag(slot, "drop", transfer);
					dispatchDrag(tile, "dragend", transfer);
					await settle();
				}
				const answer = game.progress.at(-1)?.answers["unit-2-llp"];
				assert(JSON.stringify(answer?.selectedTileIds) === JSON.stringify(["unit-2-llp-tile-0", "unit-2-llp-tile-1", "unit-2-llp-tile-2"]), "duplicate letters retain distinct tile IDs");
				assert(answer.completed && answer.attempts === 1 && answer.correctAttempts === 1, "completion counts exactly one correct attempt");
				assert(game.progress.length === 3, "each successful placement saves once");
			});

			const summary = document.createElement("p");
			summary.textContent = `${passed} checks passed, ${failed} failed.`;
			summary.className = failed ? "fail" : "pass";
			results.after(summary);
			if (failed) throw new Error(summary.textContent);
		</script>
	</body>
</html>
